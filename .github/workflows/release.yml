# A release from every push to main: the Release configuration built, tested and run headless on every OS, packaged,
# and published as one GitHub release once all three passed. The version is Core's VersionPrefix with this run's
# number as the patch, so every release is newer than the last and no one bumps a number by hand.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: setup
        uses: ./.github/actions/setup

      # MSBuild reads Version from the environment; a project with a Version of its own, as a gem has, keeps it.
      - name: Name the version
        id: version
        shell: pwsh
        run: |
          $prefix = dotnet msbuild src/Core/Core.csproj -getProperty:VersionPrefix
          $version = "$prefix.${{ github.run_number }}"
          "version=$version" >> $env:GITHUB_OUTPUT
          "Version=$version" >> $env:GITHUB_ENV

      - name: Build, test and run headless
        shell: pwsh
        run: ./tools/Validate.ps1 -Configuration Release -Only Build,Test,Headless

      # What ships is Magic's folder without what the build and the runs left in it. tar keeps the executable bit
      # that a zip would lose, so Linux and macOS get a tarball.
      - name: Package
        shell: pwsh
        run: |
          $platform = "${{ runner.os }}-${{ runner.arch }}".ToLowerInvariant()
          $name = "Magic-$env:Version-$platform"
          $excluded = 'Tests', 'Tools', 'Logs', 'Cache', 'Screenshots'
          if ($IsWindows) {
            Get-ChildItem Build/bin/Release -Exclude $excluded | Compress-Archive -DestinationPath "$name.zip"
          } else {
            $options = $excluded | ForEach-Object { "--exclude=./$_" }
            tar --create --gzip --file "$name.tar.gz" --directory Build/bin/Release @options .
          }

      - uses: actions/upload-artifact@v7
        with:
          name: Magic-${{ matrix.os }}
          path: Magic-*
          if-no-files-found: error

      - if: always()
        uses: ./.github/actions/save-natives
        with:
          key: ${{ steps.setup.outputs.natives-key }}
          hit: ${{ steps.setup.outputs.natives-hit }}

  publish:
    name: Publish
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: Magic-*
          merge-multiple: true
          path: release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.package.outputs.version }}
        run: gh release create "v$VERSION" --target "${{ github.sha }}" --title "Magic $VERSION" --generate-notes release/*
